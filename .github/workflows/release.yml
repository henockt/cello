name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w" -o "cello$ext" ./cmd/client

            # the server binary is only useful where it can be run
            if [ "$os" = linux ]; then
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -ldflags "-s -w" -o cello-server ./cmd/server
            fi

            if [ "$os" = windows ]; then
              zip -q "dist/cello_${version}_${os}_${arch}.zip" "cello$ext"
            else
              tar czf "dist/cello_${version}_${os}_${arch}.tar.gz" cello $([ "$os" = linux ] && echo cello-server)
            fi
            rm -f "cello$ext" cello-server
          done

          cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
